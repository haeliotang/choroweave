name: P0

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run worlds:build
      - run: pnpm --filter @choroweave/check test
      - run: pnpm --filter @choroweave/playground build
      - run: node scripts/validate.mjs --strict

      - run: mkdir -p .p0-reports
      - run: node scripts/tls-fixture.mjs
      - run: node scripts/live-conformance.mjs --json-out .p0-reports/live-node.json
      - run: node scripts/node-hardening.mjs --json-out .p0-reports/live-hardening.json

      - id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Browser E2E (live)
        env:
          P0_LIVE: "1"
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          P0_REPORT_OUT: .p0-reports/live-browser.json
        run: node scripts/e2e-p0.mjs

      - name: Unified conformance report
        run: node scripts/p0-report.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: p0-conformance
          path: |
            artifacts/p0-conformance.json
            artifacts/p0-conformance.md
            .p0-reports/
